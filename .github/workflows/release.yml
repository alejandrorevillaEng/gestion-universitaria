# Al subir una etiqueta vX.Y.Z: pasa los tests, publica el WAR en GitHub Releases
# (con su SHA-256 y las notas del CHANGELOG) y la imagen Docker en GitHub Packages.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publicar:
    name: WAR e imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Comprobar la etiqueta y la versión del pom
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Etiqueta no válida: $GITHUB_REF_NAME"; exit 1; }
          version_pom=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "v$version_pom" = "$GITHUB_REF_NAME" || { echo "El pom dice $version_pom"; exit 1; }

      - name: Tests y WAR
        run: ./mvnw -B verify

      - name: Release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          war="universidad-$version.war"
          cp target/universidad.war "$war"
          sha256sum "$war" > "$war.sha256"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notas.md
          gh release create "$GITHUB_REF_NAME" "$war" "$war.sha256" --title "$GITHUB_REF_NAME" --notes-file notas.md

      - name: Imagen en GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            -t "$imagen:$version" -t "$imagen:latest" .
          docker push --all-tags "$imagen"
